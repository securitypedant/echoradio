{% extends "base.html" %}
{% block title %}Admin login · Echo Radio{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3"><i class="bi bi-shield-lock me-2"></i>Admin login</h1>
        <form method="post" action="{{ url_for('login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <label for="admin_password" class="form-label">Password</label>
          <div class="input-group mb-3">
            <input type="password" class="form-control" id="admin_password" name="admin_password" autofocus autocomplete="current-password">
            <button class="btn btn-outline-secondary toggle-password" type="button" data-target="admin_password" tabindex="-1"><i class="bi bi-eye"></i></button>
          </div>
          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
