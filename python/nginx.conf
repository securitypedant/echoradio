# EchoRadio front door: one port (8080) for the web UI, HLS playlists/segments and the icecast relay.
# Written to run as an unprivileged user (no "user" directive, writable pid/temp paths).
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types {
        application/manifest+json webmanifest;
    }
    access_log off;
    # Player diagnostics: segment downloads carry ?c=<client id> only while diagnostics mode is on,
    # so this log stays empty otherwise. Trimmed by the web app's housekeeper.
    log_format segment '$time_iso8601 | c=$arg_c | $uri | status=$status bytes=$body_bytes_sent time=$request_time';
    map $arg_c $log_segment {
        ""      0;
        default 1;
    }
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    gzip on;
    gzip_types application/vnd.apple.mpegurl text/css application/javascript application/json;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 50m;

        # Icecast listener mounts: /listen/<stub> -> icecast /<stub>
        location /listen/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            add_header Access-Control-Allow-Origin * always;
        }

        # Recorded HLS segments served straight from disk.
        location ~ ^/hls/(?<stub>[a-z0-9]+)/seg/(?<file>[0-9]+_[0-9]+_[0-9]+\.ts)$ {
            alias /app/data/streams/$stub/hls/$file;
            access_log /app/data/logs/segments.log segment if=$log_segment;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin * always;
        }

        # Fallback (birdsong / voice / silence) segments.
        location ~ ^/hls/(?<stub>[a-z0-9]+)/fallback/(?<kind>[a-z]+)/(?<file>[0-9]+_[0-9]+\.ts)$ {
            alias /app/data/streams/$stub/fallback/$kind/$file;
            access_log /app/data/logs/segments.log segment if=$log_segment;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin * always;
        }

        # Playlists are generated by the web app and must never be cached.
        location ~ ^/hls/[a-z0-9_-]+/[a-z]+\.m3u8$ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Cache-Control "no-store" always;
            add_header Access-Control-Allow-Origin * always;
        }

        location /static/ {
            alias /app/static/;
            expires 1h;
        }

        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }
    }
}
