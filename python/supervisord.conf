; EchoRadio process supervisor. Runs entirely as the unprivileged "streamer" user.
[supervisord]
nodaemon=true
logfile=/app/data/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=3
pidfile=/tmp/supervisord.pid
childlogdir=/app/data/logs

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Per-stream liquidsoap programs are generated here by the web app.
[include]
files = /app/data/supervisord_configs/*.conf

[program:nginx]
command=/usr/sbin/nginx -c /app/nginx.conf -g "daemon off;"
priority=10
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/nginx.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

[program:icecast]
command=/usr/bin/icecast2 -c /app/data/icecast.xml
priority=20
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/icecast.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

[program:web]
command=bash /app/start_web.sh
directory=/app
priority=30
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/web.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true
environment=FLASK_ENV="%(ENV_FLASK_ENV)s",HOME="/home/streamer",DATA_ROOT="/app/data"

; One-shot background maintenance (fallback audio sets, v1 recording conversion). Exits when done.
[program:maintenance]
command=/opt/venv/bin/python -m maintenance
directory=/app
priority=40
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/app/data/logs/maintenance.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
environment=HOME="/home/streamer",DATA_ROOT="/app/data",TZ="UTC"
